name: Spring Boot K8s application workflow
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - '.github/workflows/app-workflow.yml'
      - 'pom.xml'
      - 'Dockerfile'
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - '.github/workflows/app-workflow.yml'
      - 'pom.xml'
      - 'Dockerfile'
  workflow_dispatch:

jobs:
  project-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6.1.0
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: maven

      - name: Build & run tests
        run: mvn --batch-mode --update-snapshots clean verify

  docker-build:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs:
      - project-build
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6.1.0
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: maven

      - name: Package application jar
        run: mvn --batch-mode -DskipTests clean package

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into the Docker Hub
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Scrape build info
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            hendisantika/springboot-k8s-sample:${{ github.run_number }}
            hendisantika/springboot-k8s-sample:latest
          build-args: |
            GIT_VERSION_TAG=${{ env.RELEASE_VERSION }}
            GIT_VERSION_HASH=${{ github.sha }}

