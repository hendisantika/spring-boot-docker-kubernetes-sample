version: 2
updates:
  # Maven dependencies (pom.xml)
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    target-branch: main
    assignees:
      - hendisantika
    labels:
      - dependencies
      - java
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: scope
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot*"
      testcontainers:
        patterns:
          - "org.testcontainers*"
      maven-minor-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "org.springframework.boot*"
          - "org.testcontainers*"

  # GitHub Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    assignees:
      - hendisantika
    labels:
      - dependencies
      - github_actions
    commit-message:
      prefix: "ci(deps)"
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

  # Docker base image (Dockerfile)
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    assignees:
      - hendisantika
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "build(deps)"
      include: scope
    ignore:
      # Stay on the current Java LTS line (25); bump major manually.
      - dependency-name: "bellsoft/liberica-openjdk-debian"
        update-types:
          - version-update:semver-major
